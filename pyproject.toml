[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "password-breach-checker"
version = "0.1.0"
description = "CLI tool to check whether a password has appeared in known data breaches"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
]

[project.scripts]
password-breach-checker = "password_breach_checker.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/password_breach_checker"]
